<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Demiryolu Rota Analizi</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #controls { padding: 15px; background: #2c3e50; color: white; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #controls input, #controls button { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        #controls button { background: #3498db; color: white; cursor: pointer; border: none; font-weight: bold; }
        #controls button:hover { background: #2980b9; }
        #controls button:disabled { background: #95a5a6; cursor: not-allowed; }
        #map { flex-grow: 1; }
    </style>
</head>
<body>

<!-- Filtreleme Paneli -->
<div id="controls">
    <label>Lokomotif ID (Zorunlu):</label>
    <input type="number" id="locoId" min="1" max="10" placeholder="Örn: 1" value="1" />

    <label>Başlangıç:</label>
    <input type="datetime-local" id="startDate" />

    <label>Bitiş:</label>
    <input type="datetime-local" id="endDate" />

    <button id="drawBtn" onclick="fetchRoute()">Rotayı Çiz</button>
    <button id="simBtn" onclick="startSimulation()">Simüle Et</button>

    <label for="simMultiplier">Hız:</label>
    <select id="simMultiplier">
        <option value="1">1x (Gerçek Zamanlı)</option>
        <option value="5">5x Hızlandırılmış</option>
        <option value="10">10x Hızlandırılmış</option>
        <option value="50">50x Hızlandırılmış</option>
    </select>

    <div style="margin-top: 10px; padding: 10px; background-color: #f4f4f4; border-radius: 5px; color: #333;">
        <strong>Durum:</strong> <span id="simStatus">-</span> |
        <strong>Hız:</strong> <span id="simSpeedText">0.0 km/h</span>
    </div>
</div>

<!-- Harita -->
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Harici Script Dosyamız -->
<script src="script.js"></script>
</body>
</html>
